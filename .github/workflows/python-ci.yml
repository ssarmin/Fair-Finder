name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.0 torchvision==0.17.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run lint checks
        run: ruff check --fix src scripts tests

      - name: Run syntax check
        run: python -m compileall src scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run smoke test for search_by_zip
        run: python scripts/search_by_zip.py --zip 27606 --query 'outdoor pottery markets under 50' --limit 1
