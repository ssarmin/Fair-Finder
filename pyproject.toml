[project]
name = "fair-finder"
version = "0.1.0"
description = "A simple Python data layer for searching fairs and exhibitions by ZIP code."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "ssarmin" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "B", "C", "Q"]
ignore = ["E501"]
target-version = "py311"
exclude = [".git", "__pycache__", ".venv", "build", "dist", "data", "tests"]
